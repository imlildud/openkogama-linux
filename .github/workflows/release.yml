name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag
        required: true
      publish:
        description: create the github release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: openkogama-launcher
      - uses: actions/checkout@v4
        with:
          repository: openkogama/openkogama-player
          path: openkogama-player
      - uses: actions/checkout@v4
        with:
          repository: openkogama/openkogama-server
          path: openkogama-server
      - uses: actions/checkout@v4
        with:
          repository: openkogama/openkogama-photon
          path: openkogama-photon
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.2
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: player
        shell: cmd
        run: |
          cmake -S openkogama-player -B build/player -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build/player || exit /b 1
          mkdir dist\player
          copy build\player\openkogama-player.exe dist\player\ || exit /b 1
          xcopy /e /i /q build\player\versions dist\player\versions || exit /b 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: launcher
        shell: cmd
        run: |
          cmake -S openkogama-launcher -B build/launcher -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_BINDIR=. || exit /b 1
          cmake --build build/launcher || exit /b 1
          cmake --install build/launcher --prefix dist || exit /b 1

      - name: server
        run: dotnet publish openkogama-server/openkogama-server.csproj -c Release -r win-x64 --self-contained -o dist/server

      - name: package
        shell: pwsh
        run: |
          Copy-Item openkogama-launcher/LICENSE.txt dist/
          $name = "openkogama-${{ inputs.tag }}-windows.zip"
          Compress-Archive -Path dist/* -DestinationPath $name
          Get-ChildItem dist | Format-Table Name, Length
          "ZIP=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.ZIP }}
      - name: release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $flags = @("--generate-notes")
          if ("${{ inputs.tag }}" -match "-") { $flags += "--prerelease" }
          gh release create "${{ inputs.tag }}" $env:ZIP -R ${{ github.repository }} --target ${{ github.sha }} --title "${{ inputs.tag }}" @flags
